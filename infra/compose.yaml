# Local dependencies for Epic 1 (Story 1.2). Image pins align with architecture review-versions.
# Start: docker compose -f infra/compose.yaml up -d

name: pcppb-local

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcppb
      POSTGRES_PASSWORD: pcppb
      POSTGRES_DB: pcppb
    ports:
      - '5432:5432'
    volumes:
      - pcppb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pcppb -d pcppb']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pcppb
      RABBITMQ_DEFAULT_PASS: pcppb
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pcppb_pg_data:
